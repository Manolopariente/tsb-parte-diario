<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSB — Gestión de Flota</title>
<meta name="theme-color" content="#1e3070">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--azul:#1e3070;--azul2:#152558;--verde:#8dc63f;--verde2:#6fa832;--rojo:#e53935;--naranja:#f59e0b;--gris:#f0f2f5;--borde:#d1d9e6;--texto:#1a2340;--muted:#6b7a99;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gris);color:var(--texto);min-height:100vh;}
.login-bg{min-height:100vh;background:url('TOPA1.jpeg') center center/cover no-repeat;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;}
.login-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(10,20,60,0.82) 0%,rgba(10,20,60,0.93) 100%);}
.login-box{position:relative;z-index:2;width:100%;max-width:400px;}
.login-logo-wrap{text-align:center;margin-bottom:24px;}
.login-logo-wrap img{height:64px;filter:brightness(0) invert(1);}
.login-titulo{color:white;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;opacity:0.9;margin-top:12px;}
.login-card{background:rgba(255,255,255,0.97);border-radius:16px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,0.45);}
.login-card-title{font-size:17px;font-weight:700;color:var(--azul);margin-bottom:20px;text-align:center;}
.error-msg{background:#ffebee;color:var(--rojo);padding:12px 16px;border-radius:10px;font-size:14px;margin-bottom:12px;text-align:center;font-weight:500;}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.8px;}
input,select{width:100%;padding:13px 16px;border:1.5px solid var(--borde);border-radius:10px;font-size:15px;color:var(--texto);background:white;margin-bottom:14px;appearance:none;-webkit-appearance:none;}
input:focus,select:focus{outline:none;border-color:var(--azul);}
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;}
.btn-primary{background:linear-gradient(135deg,var(--azul),var(--azul2));color:white;box-shadow:0 4px 12px rgba(30,48,112,0.3);}
.back-link{display:block;text-align:center;margin-top:16px;color:rgba(255,255,255,0.7);font-size:13px;text-decoration:none;}
.topbar{background:var(--azul);padding:0 12px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.25);}
.topbar img{height:26px;filter:brightness(0) invert(1);flex-shrink:0;}
.topbar-info{text-align:left;flex:1;margin:0 8px;}
.topbar-title{color:white;font-size:12px;font-weight:700;letter-spacing:1px;}
.btn-volver{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer;font-weight:600;text-decoration:none;white-space:nowrap;}
.btn-topbar{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer;font-weight:600;white-space:nowrap;margin-right:4px;}
.contenido{padding:16px;max-width:600px;margin:auto;}
.loading{text-align:center;padding:40px 20px;color:var(--muted);}
.spinner{width:36px;height:36px;border:3px solid var(--borde);border-top-color:var(--azul);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.gestion-seccion{font-size:11px;font-weight:700;color:white;text-transform:uppercase;letter-spacing:1px;background:var(--azul);padding:8px 16px;border-radius:10px 10px 0 0;margin-top:12px;}
.gestion-card{background:white;border-radius:0 0 12px 12px;padding:4px 12px;margin-bottom:4px;box-shadow:0 2px 6px rgba(0,0,0,0.06);}
.gestion-equipo-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--gris);}
.gestion-equipo-row:last-child{border-bottom:none;}
.gestion-interno{font-size:13px;font-weight:900;color:var(--azul);width:80px;flex-shrink:0;word-break:break-all;line-height:1.2;}
.gestion-tipo{font-size:11px;color:var(--muted);flex:1;line-height:1.4;}
.gestion-sel{font-size:12px;padding:7px 8px;border:1.5px solid var(--borde);border-radius:8px;background:white;color:var(--texto);margin:0;width:130px;flex-shrink:0;appearance:none;-webkit-appearance:none;}
.btn-eliminar{background:none;border:none;color:#ccc;font-size:18px;cursor:pointer;padding:4px;flex-shrink:0;line-height:1;}
.btn-eliminar:hover{color:var(--rojo);}

/* Modal agregar equipo */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal-box{background:white;border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:600px;box-shadow:0 -8px 40px rgba(0,0,0,0.2);}
.modal-titulo{font-size:16px;font-weight:700;color:var(--azul);margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:20px;}
.modal-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:5px;display:block;}
.modal-input{width:100%;padding:12px 14px;border:1.5px solid var(--borde);border-radius:10px;font-size:15px;color:var(--texto);background:white;margin-bottom:14px;appearance:none;-webkit-appearance:none;}
.modal-input:focus{outline:none;border-color:var(--azul);}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-cancelar{padding:13px;border:1.5px solid var(--borde);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;background:white;color:var(--muted);}
.btn-agregar-ok{padding:13px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--verde),var(--verde2));color:white;}

/* Botón flotante agregar */
.btn-fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--verde),var(--verde2));border:none;color:white;font-size:28px;cursor:pointer;box-shadow:0 4px 16px rgba(111,168,50,0.5);z-index:100;display:flex;align-items:center;justify-content:center;line-height:1;}
.btn-fab:active{transform:scale(0.93);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="pantalla-login">
  <div class="login-bg">
    <div class="login-overlay"></div>
    <div class="login-box">
      <div class="login-logo-wrap">
        <img src="logo.png" alt="TSB">
        <div class="login-titulo">Gestión de Flota</div>
      </div>
      <div class="login-card">
        <div class="login-card-title">⚙️ Acceso ADMIN</div>
        <div id="login-error" class="error-msg" style="display:none;"></div>
        <label>Contraseña ADMIN</label>
        <input type="password" id="inp-pass" placeholder="Tu contraseña" onkeydown="if(event.key==='Enter')ingresar()">
        <button class="btn btn-primary" onclick="ingresar()">INGRESAR</button>
      </div>
      <a href="index.html" class="back-link">← Volver al ingreso de supervisores</a>
    </div>
  </div>
</div>

<!-- GESTIÓN -->
<div id="pantalla-gestion" style="display:none;">
  <div class="topbar">
    <img src="logo.png" alt="TSB">
    <div class="topbar-info">
      <div class="topbar-title">GESTIÓN DE FLOTA</div>
    </div>
    <button class="btn-topbar" onclick="cargarEquipos()">↻</button>
    <button class="btn-topbar" onclick="compartirFlota()" style="background:rgba(141,198,63,0.25);border-color:rgba(141,198,63,0.5);">📤</button>
    <button class="btn-topbar" id="btn-guardar-top" onclick="guardarCambios()" style="background:rgba(255,255,255,0.25);">✓</button>
    <a href="index.html" class="btn-volver">←</a>
  </div>
  <div class="contenido">
    <div id="gestion-loading" class="loading"><div class="spinner"></div>Cargando equipos...</div>
    <div id="gestion-contenido"></div>
  </div>
</div>

<!-- MODAL AGREGAR EQUIPO -->
<div id="modal-agregar" class="modal-overlay" style="display:none;" onclick="if(event.target===this)cerrarModal()">
  <div class="modal-box">
    <div class="modal-titulo">➕ Agregar equipo</div>
    <div class="modal-sub">Ingresá los datos del equipo a incorporar al contrato.</div>
    <div id="modal-error" class="error-msg" style="display:none;"></div>
    <span class="modal-label">Interno</span>
    <input class="modal-input" id="nuevo-interno" placeholder="Ej: BATEA_TC_001" maxlength="40">
    <span class="modal-label">Tipo de equipo</span>
    <select class="modal-input" id="nuevo-tipo"></select>
    <span class="modal-label">Yacimiento</span>
    <select class="modal-input" id="nuevo-yac">
      <option value="">— Seleccioná yacimiento —</option>
      <option>Señal Picada</option>
      <option>BDT - NAR</option>
      <option>Obras</option>
      <option>Lomita</option>
      <option>Puesto Hernandez</option>
      <option value="">Sin asignar</option>
    </select>
    <div class="modal-btns">
      <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-agregar-ok" onclick="confirmarAgregar()">Agregar</button>
    </div>
  </div>
</div>

<!-- FAB -->
<button class="btn-fab" id="btn-fab" style="display:none;" onclick="abrirModal()" title="Agregar equipo">＋</button>

<script>
var API="https://script.google.com/macros/s/AKfycbxUqQerIBYj76ohuo1mJtFQzcoufeM7VUxdSxxJATSk8gYghPAqP7iJZDbKUrvRiUWw/exec";
var YACS_LISTA=['Señal Picada','BDT - NAR','Obras','Lomita','Puesto Hernandez','Sin asignar'];
var equiposCargados=[];
var cambiosPendientes={};

function fetchConTimeout(url,opciones,ms){
  ms=ms||25000;
  return Promise.race([
    fetch(url,opciones),
    new Promise(function(_,reject){setTimeout(function(){reject(new Error('timeout'));},ms);})
  ]);
}

function ingresar(){
  var pass=document.getElementById('inp-pass').value.trim();
  var errEl=document.getElementById('login-error');
  errEl.style.display='none';
  if(!pass){errEl.textContent='Ingresá tu contraseña';errEl.style.display='block';return;}
  fetchConTimeout(API+'?action=getLoginData',{},20000)
    .then(function(r){return r.json();})
    .then(function(data){
      var admin=data.supervisores.find(function(s){
        return s.rol==='ADMIN'&&String(s.password)===String(pass);
      });
      if(!admin){errEl.textContent='Contraseña incorrecta';errEl.style.display='block';return;}
      document.getElementById('pantalla-login').style.display='none';
      document.getElementById('pantalla-gestion').style.display='block';
      document.getElementById('btn-fab').style.display='flex';
      cargarEquipos();
    })
    .catch(function(){errEl.textContent='Error de conexión';errEl.style.display='block';});
}

function cargarEquipos(){
  document.getElementById('gestion-loading').style.display='block';
  document.getElementById('gestion-contenido').innerHTML='';
  cambiosPendientes={};
  fetchConTimeout(API+'?action=getEquiposAdmin&t='+Date.now(),{},20000)
    .then(function(r){return r.json();})
    .then(function(equipos){
      equiposCargados=equipos;
      renderGestion(equipos);
      document.getElementById('gestion-loading').style.display='none';
    })
    .catch(function(){
      document.getElementById('gestion-loading').innerHTML=
        '<div style="background:#ffebee;color:#e53935;padding:12px;border-radius:10px;text-align:center;">Error al cargar. <button onclick="cargarEquipos()" style="background:var(--azul);color:white;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;margin-left:8px;">Reintentar</button></div>';
    });
}

function renderGestion(equipos){
  var grupos={};
  YACS_LISTA.forEach(function(y){grupos[y]=[];});
  equipos.forEach(function(eq){
    var yac=eq.yacimiento||'Sin asignar';
    if(!grupos[yac])grupos[yac]=[];
    grupos[yac].push(eq);
  });
  var html='';
  YACS_LISTA.forEach(function(yac){
    var lista=grupos[yac]||[];
    html+='<div class="gestion-seccion">'+yac+' — '+lista.length+' equipo'+(lista.length!==1?'s':'')+'</div>';
    html+='<div class="gestion-card">';
    if(lista.length===0){
      html+='<div style="color:var(--muted);font-size:13px;padding:10px 0;">Sin equipos asignados</div>';
    }else{
      lista.forEach(function(eq){
        var yacActual=eq.yacimiento||'Sin asignar';
        var optsYac=YACS_LISTA.map(function(y){
          return '<option value="'+y+'" '+(yacActual===y?'selected':'')+'>'+y+'</option>';
        }).join('');
        var tipoLimpio=eq.tipo.replace(/^TARIFA [AC] /i,'').replace(/\[.*\]/,'').trim();
        html+=
          '<div class="gestion-equipo-row" id="fila-'+eq.fila+'">'+
            '<div class="gestion-interno">'+eq.interno+'</div>'+
            '<div class="gestion-tipo">'+tipoLimpio+'</div>'+
            '<select class="gestion-sel" onchange="marcarCambio('+eq.fila+',this.value,this)">'+optsYac+'</select>'+
            '<button class="btn-eliminar" onclick="eliminarEquipo('+eq.fila+',\''+eq.interno.replace(/'/g,"\\'")+'\')" title="Eliminar equipo">🗑</button>'+
          '</div>';
      });
    }
    html+='</div>';
  });
  html+='<button onclick="guardarCambios()" id="btn-guardar-bot" style="width:100%;padding:14px;background:#1e3070;color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:16px;margin-bottom:80px;">✓ Guardar cambios</button>';
  document.getElementById('gestion-contenido').innerHTML=html;
}

function marcarCambio(fila,nuevoYac,sel){
  var yacVal=nuevoYac==='Sin asignar'?'':nuevoYac;
  cambiosPendientes[fila]=yacVal;
  sel.style.borderColor='#f59e0b';
}

function guardarCambios(){
  var filas=Object.keys(cambiosPendientes);
  if(filas.length===0){alert('No hay cambios para guardar.');return;}
  var btnTop=document.getElementById('btn-guardar-top');
  var btnBot=document.getElementById('btn-guardar-bot');
  if(btnTop){btnTop.textContent='...';btnTop.disabled=true;}
  if(btnBot){btnBot.textContent='Guardando...';btnBot.disabled=true;}
  var promesas=filas.map(function(fila){
    return fetchConTimeout(API+'?action=actualizarEquipo',{method:'POST',body:JSON.stringify({fila:Number(fila),yacimiento:cambiosPendientes[fila]})},15000)
      .then(function(r){return r.json();});
  });
  Promise.all(promesas)
    .then(function(){
      cambiosPendientes={};
      document.querySelectorAll('.gestion-sel').forEach(function(s){s.style.borderColor='';});
      if(btnTop){btnTop.textContent='✓';btnTop.style.background='rgba(141,198,63,0.4)';btnTop.disabled=false;}
      if(btnBot){btnBot.textContent='✓ Cambios guardados';btnBot.style.background='#6fa832';btnBot.disabled=false;}
      setTimeout(function(){
        if(btnTop){btnTop.style.background='rgba(255,255,255,0.25)';}
        if(btnBot){btnBot.textContent='✓ Guardar cambios';btnBot.style.background='#1e3070';}
      },2000);
    })
    .catch(function(){
      if(btnTop){btnTop.textContent='✓';btnTop.disabled=false;}
      if(btnBot){btnBot.textContent='✓ Guardar cambios';btnBot.disabled=false;}
      alert('Error al guardar. Verificá la conexión.');
    });
}

// ── ELIMINAR EQUIPO ───────────────────────────────────────────────────────────
function eliminarEquipo(fila, interno){
  if(!confirm('¿Eliminar el equipo "'+interno+'" del sistema?\n\nEsta acción no se puede deshacer.')){return;}
  fetchConTimeout(API+'?action=eliminarEquipo',{method:'POST',body:JSON.stringify({fila:fila})},15000)
    .then(function(r){return r.json();})
    .then(function(data){
      if(data.ok){
        // Quitar la fila del DOM sin recargar todo
        var filaEl=document.getElementById('fila-'+fila);
        if(filaEl)filaEl.remove();
        // Actualizar array local
        equiposCargados=equiposCargados.filter(function(eq){return eq.fila!==fila;});
      }else{
        alert('Error al eliminar. Intentá de nuevo.');
      }
    })
    .catch(function(){alert('Error de conexión al eliminar.');});
}

// ── AGREGAR EQUIPO ────────────────────────────────────────────────────────────
function abrirModal(){
  // Poblar selector de tipos con los tipos únicos cargados
  var tiposSet={};
  equiposCargados.forEach(function(eq){
    var t=eq.tipo;
    if(t&&!tiposSet[t])tiposSet[t]=true;
  });
  var selTipo=document.getElementById('nuevo-tipo');
  selTipo.innerHTML='<option value="">— Seleccioná tipo —</option>';
  Object.keys(tiposSet).sort().forEach(function(t){
    var label=t.replace(/^TARIFA [AC] /i,'').replace(/\[.*\]/,'').trim();
    var opt=document.createElement('option');
    opt.value=t;
    opt.textContent=label;
    selTipo.appendChild(opt);
  });
  document.getElementById('nuevo-interno').value='';
  document.getElementById('nuevo-yac').value='';
  document.getElementById('modal-error').style.display='none';
  document.getElementById('modal-agregar').style.display='flex';
}

function cerrarModal(){
  document.getElementById('modal-agregar').style.display='none';
}

function confirmarAgregar(){
  var interno=document.getElementById('nuevo-interno').value.trim().toUpperCase();
  var tipo=document.getElementById('nuevo-tipo').value;
  var yac=document.getElementById('nuevo-yac').value;
  var errEl=document.getElementById('modal-error');
  errEl.style.display='none';

  if(!interno){errEl.textContent='Ingresá un nombre para el interno.';errEl.style.display='block';return;}
  if(!tipo){errEl.textContent='Seleccioná el tipo de equipo.';errEl.style.display='block';return;}

  // Verificar que el interno no exista ya
  var existe=equiposCargados.find(function(eq){return eq.interno.toUpperCase()===interno;});
  if(existe){errEl.textContent='Ya existe un equipo con ese interno.';errEl.style.display='block';return;}

  // Obtener categoría del primer equipo con ese tipo
  var eqRef=equiposCargados.find(function(eq){return eq.tipo===tipo;});
  var categoria=eqRef?eqRef.categoria:'';

  var btnOk=document.querySelector('.btn-agregar-ok');
  btnOk.textContent='Agregando...';btnOk.disabled=true;

  fetchConTimeout(API+'?action=agregarEquipo',{
    method:'POST',
    body:JSON.stringify({interno:interno,tipo:tipo,categoria:categoria,yacimiento:yac})
  },15000)
    .then(function(r){return r.json();})
    .then(function(data){
      btnOk.textContent='Agregar';btnOk.disabled=false;
      if(data.ok){
        cerrarModal();
        cargarEquipos(); // recarga para ver el nuevo equipo con su fila correcta
      }else{
        errEl.textContent='Error al agregar. Intentá de nuevo.';errEl.style.display='block';
      }
    })
    .catch(function(){
      btnOk.textContent='Agregar';btnOk.disabled=false;
      errEl.textContent='Error de conexión.';errEl.style.display='block';
    });
}
// ── FIN AGREGAR ───────────────────────────────────────────────────────────────

function compartirFlota(){
  if(equiposCargados.length===0){alert('Cargá los equipos primero.');return;}
  var YACS=['Señal Picada','BDT - NAR','Obras','Lomita','Puesto Hernandez'];
  var hoy=new Date();
  var fecha=String(hoy.getDate()).padStart(2,'0')+'/'+String(hoy.getMonth()+1).padStart(2,'0')+'/'+hoy.getFullYear();
  var lineas=['🏗 *TSB — Flota en campo*','📅 '+fecha];
  var totalEquipos=0;
  YACS.forEach(function(yac){
    var equipos=equiposCargados.filter(function(eq){
      return (eq.yacimiento||'Sin asignar')===yac&&eq.activo;
    });
    if(equipos.length===0)return;
    lineas.push('');
    lineas.push('*'+yac.toUpperCase()+'*');
    equipos.forEach(function(eq){
      var tipo=eq.tipo.replace(/^TARIFA [AC] /i,'').replace(/\[.*\]/,'').trim();
      lineas.push('• '+eq.interno+' — '+tipo);
      totalEquipos++;
    });
  });
  lineas.push('');
  lineas.push('_Total: '+totalEquipos+' equipos en campo_');
  window.open('https://wa.me/?text='+encodeURIComponent(lineas.join('\n')),'_blank');
}
</script>
</body>
</html>
